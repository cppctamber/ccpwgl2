<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CCPWGL Character Runtime Proof</title>
    <link rel="stylesheet" href="./stylesheet.css">
    <script type="importmap">
        {
            "imports": {
                "@carbonenginejs/runtime-utils/model": "/vendor/runtime-utils/model/index.js",
                "@carbonenginejs/runtime-utils/path": "/vendor/runtime-utils/path.js",
                "@carbonenginejs/runtime-utils/schema": "/vendor/runtime-utils/schema/index.js"
            }
        }
    </script>
    <script defer src="../../dist/ccpwgl2_int.js"></script>
    <script type="module" src="./src/main.mjs"></script>
</head>
<body>
    <main class="character-demo">
        <header class="character-demo__header">
            <div>
                <p class="eyebrow">CarbonEngineJS integration proof</p>
                <h1>Character runtime</h1>
            </div>
            <output id="demo-status" class="status" aria-live="polite">Booting</output>
        </header>

        <section class="stage" aria-label="Character rendering stage">
            <canvas id="character-canvas" aria-label="Character rendering canvas"></canvas>
            <div id="stage-message" class="stage__message">
                <strong id="stage-title">Renderer starting</strong>
                <span>Loading the character library and legacy OpenGL proof adapter.</span>
            </div>
        </section>

        <section class="controls" aria-label="Character selection">
            <label for="paperdoll-id">Paper-doll record ID</label>
            <div class="controls__row">
                <input id="paperdoll-id" inputmode="numeric" autocomplete="off">
                <button id="resolve-paperdoll" type="button">Resolve</button>
            </div>
            <label for="paperdoll-samples">Sample records</label>
            <select id="paperdoll-samples">
                <option value="">Library pending</option>
            </select>
        </section>

        <section class="diagnostic-grid">
            <article>
                <h2>Library</h2>
                <pre id="library-summary">Pending</pre>
            </article>
            <article>
                <h2>Appearance plan</h2>
                <pre id="plan-summary">Pending</pre>
            </article>
            <article>
                <h2>Construction sequence</h2>
                <pre id="construction-summary">Pending</pre>
            </article>
            <article>
                <h2>Renderer</h2>
                <pre id="renderer-summary">Pending</pre>
            </article>
            <article>
                <h2>Diagnostics</h2>
                <ol id="plan-diagnostics">
                    <li>Pending</li>
                </ol>
            </article>
        </section>
    </main>
</body>
</html>
